<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>

</head>
<body>

    <h2>Lista de Alunos Matriculados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF:</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${listAlunos}">
                <td th:text="${aluno.idaluno}"></td>
                <td th:text="${aluno.nome}"></td>
                <td th:text="${aluno.cpf}"></td>
                <td th:text="${aluno.email}"></td>

                <td>
                    <a th:href="@{/aluno/editar/{id}(id=${aluno.idaluno})}">Editar</a> |
                    <a th:href="@{/aluno/excluir/{id}(id=${aluno.idaluno})}" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/aluno/cadastrarAluno}">+ Cadastrar Novo Aluno</a>

</body>
</html>
